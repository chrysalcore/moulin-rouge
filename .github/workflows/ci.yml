name: CI
run-name: "CI — ${{ github.event.head_commit.message || github.event_name }}"

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  open-pr:
    name: Open PR to main
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Abrir PR a main si no hay uno abierto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          abiertos=$(gh pr list --base main --head develop --state open --json number --jq 'length')
          if [ "$abiertos" = "0" ]; then
            gh pr create --base main --head develop \
              --title "develop → main" \
              --body "Lint y build en verde en develop."
          else
            echo "Ya hay un PR abierto de develop a main; el push lo actualiza solo."
          fi
